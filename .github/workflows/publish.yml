name: Release tooling package
on:
  push:
    tags: ['helpers-v*', 'automation-v*', 'eslint-config-v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '25.8.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack and validate tagged package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run scripts/pack-tagged-package.ts
      - name: Publish GitHub package release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          gh release create "$RELEASE_TAG" "$PACKAGE_TARBALL" \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Install the attached package tarball using its versioned release URL." \
            --latest=false
